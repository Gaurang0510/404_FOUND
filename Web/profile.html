<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warden Profile | HostelSync Portal</title>
  <meta name="description" content="View and manage warden profile settings" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="sidebar-root"></div>
  <div id="navbar-root"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h2>Profile Settings</h2>
        <p>Manage your account, preferences, and security settings.</p>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 2fr;gap:32px">
      <!-- Profile Summary -->
      <div class="glass-card" style="align-self:start">
        <div style="text-align:center;margin-bottom:24px">
          <img id="profileAvatar" alt="Profile" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBx4WzLwZYQO65lwd1M7EiafLRRiyCXA63QepyvP6ut-AUlOiYz8ZL-CAINEdo-dX3iH-oDp425-V8FuUpztt0na1YNDshL6rJUIYLwJVjMCH6tpmyfXuHNoN28Y6X2hET5P4XW1qY4saL20qqJKP8xcvYORrsDhnZrqCpv2ZVlU-ZKoYJjnxDXa48wjdL7NIuxKPwiZSoGFa6UAR-ZW_kK-OxNkROfZF5jqC22lzCGn8NIPrvh6IQ4fA9qXZqPpSr7R_IpNq1SSY"
               style="width:120px;height:120px;border-radius:50%;object-fit:cover;margin:0 auto 16px;border:4px solid var(--surface-container-high)" />
          <h3 id="profileName" style="font-family:var(--font-headline);font-size:1.5rem;font-weight:700">Warden Name</h3>
          <p id="profileRole" style="color:var(--primary);font-weight:600;font-size:0.875rem">Chief Warden</p>
          <p id="profileHostel" style="color:var(--on-surface-variant);font-size:0.875rem;margin-top:4px">Block A</p>
        </div>
        <button class="btn btn-secondary" style="width:100%;justify-content:center"><span class="material-symbols-outlined">photo_camera</span> Change Photo</button>
      </div>

      <!-- Settings Form -->
      <div class="section-card">
        <div class="section-card-header" style="margin-bottom:24px">
          <h4>Personal Information</h4>
        </div>
        <form id="profileForm" onsubmit="saveProfile(event)">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
            <div class="form-group" style="margin:0"><label class="form-label">Full Name</label><input class="form-input" id="pName" required /></div>
            <div class="form-group" style="margin:0"><label class="form-label">Email Address</label><input type="email" class="form-input" id="pEmail" required /></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px">
            <div class="form-group" style="margin:0"><label class="form-label">Phone Number</label><input type="tel" class="form-input" id="pPhone" /></div>
            <div class="form-group" style="margin:0"><label class="form-label">Block Assigned</label><select class="form-input" id="pBlock"><option value="A">Block A</option><option value="B">Block B</option><option value="C">Block C</option></select></div>
          </div>
          
          <div class="section-card-header" style="margin-bottom:24px;border-top:1px solid rgba(69,70,77,0.2);padding-top:32px">
            <h4>Security</h4>
          </div>
          <div class="form-group"><label class="form-label">Current Password</label><input type="password" class="form-input" placeholder="••••••••" /></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px">
            <div class="form-group" style="margin:0"><label class="form-label">New Password</label><input type="password" class="form-input" /></div>
            <div class="form-group" style="margin:0"><label class="form-label">Confirm Password</label><input type="password" class="form-input" /></div>
          </div>

          <div style="display:flex;justify-content:flex-end;gap:12px;border-top:1px solid rgba(69,70,77,0.2);padding-top:24px">
            <button type="button" class="btn btn-secondary" onclick="api.logout()">Logout</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="assets/js/api_service.js"></script>
  <script src="assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initPage('profile', 'Dashboard / Profile');
      loadProfileData();
    });

    function loadProfileData() {
      const user = api.getUser() || { name: 'Warden', role: 'Chief Warden', email: 'warden@hostelsync.com' };
      
      document.getElementById('profileName').textContent = user.name;
      document.getElementById('profileRole').textContent = user.role;
      
      document.getElementById('pName').value = user.name;
      document.getElementById('pEmail').value = user.email || '';
      // Load other fields if available
    }

    function saveProfile(e) {
      e.preventDefault();
      // Normally would call api update endpoint here
      const newName = document.getElementById('pName').value;
      const user = api.getUser() || {};
      user.name = newName;
      localStorage.setItem('hostelsync_user', JSON.stringify(user));
      
      document.getElementById('profileName').textContent = newName;
      document.getElementById('navProfileName').textContent = newName;
      showToast('Profile updated successfully', 'success');
    }
  </script>
</body>
</html>
