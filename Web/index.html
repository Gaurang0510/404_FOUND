<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HostelSync Warden Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1325 0%, #060e20 100%);
      padding: 1rem;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface-container-low);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      box-shadow: 0 0 40px rgba(173, 198, 255, 0.1);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-on-primary-container) 100%);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(173, 198, 255, 0.3);
    }

    .login-logo .material-symbols-outlined {
      font-size: 1.75rem;
      color: var(--color-on-primary);
    }

    .login-title {
      font-size: var(--font-size-2xl);
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--color-on-surface);
    }

    .login-subtitle {
      color: var(--color-on-surface-variant);
      font-size: var(--font-size-sm);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .login-form .form-group {
      margin-bottom: 0;
    }

    .login-form .btn {
      width: 100%;
      justify-content: center;
      padding: 0.875rem;
      font-size: var(--font-size-base);
    }

    .login-error {
      background: rgba(255, 180, 171, 0.1);
      color: var(--color-error);
      padding: 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      display: none;
    }

    .login-error.show {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--color-on-surface-variant);
      font-size: var(--font-size-sm);
    }

    .loading {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(173, 198, 255, 0.3);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <span class="material-symbols-outlined">domain</span>
        </div>
        <h1 class="login-title">HostelSync</h1>
        <p class="login-subtitle">Warden Portal Login</p>
      </div>

      <div class="login-error" id="errorMessage"></div>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="your@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          Sign In
        </button>
      </form>

      <div class="login-footer">
        <p>Demo Login → Use any credentials</p>
      </div>
    </div>
  </div>

  <script src="assets/js/api_service.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');

    // Check if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('authToken');
      if (token) {
        window.location.href = 'dashboard.html';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="loading"></span> Logging in...';
      errorMessage.classList.remove('show');

      try {
        // For demo purposes - accept any login
        // In production, this would call: await APIService.login({ email, password });
        
        const userData = {
          name: email.split('@')[0],
          email: email,
          role: 'Chief Warden'
        };

        localStorage.setItem('authToken', 'demo-token-' + Date.now());
        localStorage.setItem('userData', JSON.stringify(userData));

        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);

      } catch (error) {
        errorMessage.textContent = error.message || 'Login failed. Please try again.';
        errorMessage.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
